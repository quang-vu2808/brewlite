
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-brewlite}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-brewlite}
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - brewlite_task9_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3002}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-brewlite}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-brewlite}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PAYMENT_DEMO_ENABLED: ${PAYMENT_DEMO_ENABLED:-false}
    ports:
      - "127.0.0.1:${API_PUBLISHED_PORT:-3003}:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL_DOCKER:-http://127.0.0.1:3003}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PUBLISHED_PORT:-3002}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  brewlite_task9_pgdata:
    name: brewlite_task9_pgdata
